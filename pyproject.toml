[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-maya"
version = "0.1.0"
description = "Maya scene diagnostics and asset publication tools"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Swayam Singal"}]

[tool.setuptools.packages.find]
where = ["python"]
